[project]
name = "contentforge-backend"
version = "0.1.0"
description = "ContentForge FastAPI Backend"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.10.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "stripe>=15.0.0",
    "httpx>=0.28.0",
    "python-multipart>=0.0.20",
    "aiohttp>=3.11.0",
]

[tool.uv]
dev-dependencies = []
